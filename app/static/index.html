async function openBudgets() {
  const B = await api("/budgets");
  const r5 = (n) => Math.max(5, Math.ceil(n / 5) * 5);   // suggestions rounded up to $5
  const span = B.months.length ? `${fmtDay(B.months[0] + "-01", { month: "short" })}–${fmtDay(B.months.at(-1) + "-01", { month: "short" })}` : "";
  const rows = B.items.map((c) => `<div class="bud-edit" data-name="${esc(c.name)}" data-typ="${c.typical}">
      <span class="cat-name"><i class="dot" style="background:${col(c.color)}"></i>${esc(c.name)}</span>
      ${c.typical > 0 ? `<button type="button" class="ghost use num" title="Use the typical month">${money(r5(c.typical), true)}</button>` : "<span></span>"}
      <input class="num" inputmode="decimal" placeholder="No budget" value="${c.budget ?? ""}" aria-label="${esc(c.name)} budget">
      <small class="num">typical ${money(c.typical, true)} · avg ${money(c.average, true)} · last month ${money(c.last, true)}</small>
    </div>`).join("");
  modal(`<h3>Budgets</h3>
    <p class="note">Monthly limits per category. “Typical” is your median month${span ? ` over ${span}` : ""}, so one-off big purchases don't inflate it. Tap a suggestion to use it.</p>
    <label class="field"><span>Total monthly budget (all spending)</span><input id="btotal" inputmode="decimal" placeholder="No total budget" value="${B.total ?? ""}"></label>
    <div id="budlist">${rows}</div>
    <p class="note num" id="budsum"></p>
    <div class="actions"><button type="button" class="btn secondary left" id="fillb">Fill blanks with typical</button>
      <button type="button" class="btn secondary" id="cancelb">Cancel</button><button type="button" class="btn" id="saveb">Save</button></div>`, (m) => {
    const inputs = () => [...m.querySelectorAll(".bud-edit")].map((row) => ({ row, name: row.dataset.name, typ: +row.dataset.typ, el: $("input", row) }));
    const val = (el) => { const v = parseFloat(el.value.replace(/[$,\s]/g, "")); return isFinite(v) && v > 0 ? v : null; };
    const update = () => {
      const sum = inputs().reduce((a, x) => a + (val(x.el) || 0), 0), total = val($("#btotal", m));
      const parts = [`Category budgets add up to ${money(sum, true)}`];
      if (total) parts.push(sum > total ? `<span style="color:var(--bad)">${money(sum - total, true)} more than the total</span>` : `${money(total - sum, true)} of the total not assigned`);
      if (B.income_avg) parts.push(`average income ${money(B.income_avg, true)}/month`);
      $("#budsum", m).innerHTML = parts.join(" · ");
    };
    m.addEventListener("input", update);
    inputs().forEach((x) => { const u = $(".use", x.row); if (u) u.onclick = () => { x.el.value = r5(x.typ); update(); }; });
    $("#fillb", m).onclick = () => { inputs().forEach((x) => { if (!x.el.value.trim() && x.typ > 0) x.el.value = r5(x.typ); }); update(); };
    $("#cancelb", m).onclick = closeModal;
    $("#saveb", m).onclick = async () => {
      const categories = {};
      for (const x of inputs()) {
        const before = B.items.find((c) => c.name === x.name).budget, now = val(x.el);
        if (now !== before) categories[x.name] = now;
      }
      await api("/budgets", { method: "PUT", body: { total: val($("#btotal", m)), categories } });
      closeModal(); toast("Budgets saved"); refreshAll();
    };
    update();
  });
}

// ---------- cash flow chart ----------
// corners get a small radius, so a jagged series still reads as one drawn line
function roundedLine(p, r = 7) {
  if (!p.length) return "";
  let d = `M${p[0][0]} ${p[0][1]}`;
  for (let i = 1; i < p.length - 1; i++) {
    const [ax, ay] = p[i - 1], [x, y] = p[i], [bx, by] = p[i + 1];
    const la = Math.hypot(x - ax, y - ay) || 1, lb = Math.hypot(bx - x, by - y) || 1;
    const ra = Math.min(r, la / 2), rb = Math.min(r, lb / 2);
    d += `L${x - ((x - ax) / la) * ra} ${y - ((y - ay) / la) * ra}Q${x} ${y} ${x + ((bx - x) / lb) * rb} ${y + ((by - y) / lb) * rb}`;
  }
  return d + `L${p.at(-1)[0]} ${p.at(-1)[1]}`;
}
function niceStep(max, n = 5) {
  const raw = max / n, mag = 10 ** Math.floor(Math.log10(raw || 1));
  return ([1, 1.5, 2, 2.5, 3, 5, 7.5, 10].find((m) => m * mag >= raw) || 10) * mag;
}
const axisMoney = (n) => (S.hideAll ? "••" : n >= 1000 ? `$${(n / 1000).toFixed(1)}K` : `$${n}`);

// slots across the x axis; anything past today has no point, so the lines stop there
function chartSeries() {
  const s = S.stats, cur = localToday().slice(0, 7), today = localToday();
  if (S.flow === "daily") {
    const inc = {};
    S.income.items.forEach((i) => { inc[i.date] = (inc[i.date] || 0) + i.amount; });
    return s.days.map((d) => ({ key: d.date, label: +d.date.slice(8) % 5 === 1 ? String(+d.date.slice(8)) : "", title: fmtDay(d.date, { month: "long", day: "numeric", year: "numeric" }),
      exp: d.total, inc: inc[d.date] || 0, future: d.future }));
  }
  if (S.flow === "weekly") {
    const weeks = [];
    s.days.forEach((d) => {
      const dow = (new Date(d.date + "T12:00:00").getDay() + 6) % 7;
      if (!weeks.length || dow === 0) weeks.push({ key: d.date, from: d.date, exp: 0, inc: 0, future: d.future });
      const w = weeks.at(-1);
      w.to = d.date; w.exp += d.total; w.future = w.future && d.future;
      w.inc += S.income.items.filter((i) => i.date === d.date).reduce((a, i) => a + i.amount, 0);
    });
    return weeks.map((w) => ({ ...w, label: fmtDay(w.from, { month: "short", day: "numeric" }), title: `${fmtDay(w.from, { month: "short", day: "numeric" })} – ${fmtDay(w.to, { month: "short", day: "numeric" })}` }));
  }
  return S.trend.months.map((m) => ({ key: m.month, label: m.label, title: fmtDay(m.month + "-15", { month: "long", year: "numeric" }), exp: m.total, inc: m.income || 0, future: m.month > cur, cats: m.by_category, month: m.month }));
}
function renderChart() {
  const card = $("#chartcard");
  if (!card || !S.stats || !S.trend || S.view !== "dashboard") return;
  S.flow ||= "monthly";
  const ms = S.trend.months;
  const yearTotal = ms.reduce((a, m) => a + m.total, 0), yearIncome = ms.reduce((a, m) => a + (m.income || 0), 0);
  card.innerHTML = `<div class="chart-h"><h2>Cash Flow Overview</h2><span class="note num">${S.trendYear}: ${money(yearTotal, true)} spent · ${money(yearIncome, true)} income</span>
      <div class="seg2">${[["daily", "Daily"], ["weekly", "Weekly"], ["monthly", "Monthly"]].map(([k, v]) => `<button data-flow="${k}" class="${S.flow === k ? "on" : ""}">${v}</button>`).join("")}</div></div>
    <div class="chart" id="chart"></div>`;
  card.querySelectorAll("[data-flow]").forEach((b) => b.onclick = () => { S.flow = b.dataset.flow; renderChart(); });
  const box = $("#chart"), W = box.clientWidth || 640, H = box.clientHeight || 252;
  const pad = { l: 48, r: 0, t: 8, b: 26 };
  const pts = chartSeries(), n = pts.length, live = pts.filter((p) => !p.future);
  const step = niceStep(Math.max(1, ...live.map((p) => Math.max(p.exp, p.inc))));
  const top = step * 5, iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const X = (i) => pad.l + (n > 1 ? (i / (n - 1)) * iw : iw / 2), Y = (v) => pad.t + ih - (Math.min(v, top) / top) * ih;
  const liveIdx = pts.map((p, i) => (p.future ? -1 : i)).filter((i) => i >= 0);
  const line = (k) => liveIdx.map((i) => [X(i), Y(pts[i][k])]);
  const incLine = line("inc"), expLine = line("exp");
  const base = pad.t + ih;
  const area = liveIdx.length ? `${roundedLine(incLine)}L${incLine.at(-1)[0]} ${base}L${incLine[0][0]} ${base}Z` : "";
  const accent = "var(--accent)", gold = "var(--gold)";
  const grid = Array.from({ length: 6 }, (_, i) => {
    const v = step * i, y = Y(v);

  $("#txcard").innerHTML = `<div class="tx-h"><h2>${S.day ? fmtDay(S.day, { weekday: "long", month: "long", day: "numeric" }) : "Transaction History"}</h2>
      <div class="tx-tools"><label class="tsearch">${ICON.search}<input id="q" placeholder="Search" aria-label="Search purchases" value="${esc(typing ?? S.q)}"></label><button class="btn dark" id="filter">${ICON.filter}Filter</button></div></div>

    <div class="tbody">${rows.length ? rows.join("") : `<div class="empty">${S.review ? "Nothing left to review" : S.q || S.day || S.category ? "No matching purchases" : "No purchases this month"}</div>`}</div>
    <div class="tfoot"><span class="num">${picked.length ? `${picked.length} selected · ${money(picked.reduce((a, x) => a + x, 0))}` : `Showing ${t.items.length} of ${t.count} · ${money(t.total)}`}</span>

  $("#txcard").querySelectorAll("[data-clear]").forEach((el) => el.onclick = () => {
    S[el.dataset.clear] = null; S.offset = 0;

  renderRail(); renderTxStats(); renderInspector();
  fitTx();
}
// filters that sit above the table on the Transactions tab

      <div class="ins-amt num ${i.amount < 0 ? "pos" : ""}">${i.fx_pending ? "…" : `${i.amount < 0 ? "+" : "−"}${money(Math.abs(i.amount))}`}</div>

      ${row("Time", i.source === "bank" ? "" : fmtTime(i.ts))}
      ${row("Card", esc(i.card))}
      ${row("Charged in", esc(fxText(i)))}
      ${row("Card charged", i.shared ? money(i.full_amount) : "")}
      ${row("Your share", i.shared ? money(i.amount) : "")}
      ${row("Still owed", i.owed ? money(i.owed) : "")}
      ${row("Note", esc(i.note))}
    </div>

// every purchase at this merchant, however old; a search only, so it can arrive late
let histSeq = 0;
async function merchantHistory(i) {
  const seq = ++histSeq, cached = S.hist[i.merchant];
  const r = cached || await api(`/tx?${new URLSearchParams({ q: i.merchant, limit: 5 })}`).catch(() => null);
  const el = $("#inshist");
  if (!r || !el || seq !== histSeq) return;
  S.hist[i.merchant] = r;
  el.innerHTML = `<h3><span>All time here</span><b class="num">${r.count} × · ${money(r.total, true)}</b></h3>` +
    r.items.map((x) => `<div class="hrow num ${x.id === i.id ? "me" : ""}"><span>${fmtDay(x.date, { month: "short", day: "numeric", year: "numeric" })}</span><span>${money(x.amount)}</span></div>`).join("");
}
function filterPop(anchor) {
  closePop();
  const pop = document.createElement("div");
  pop.className = "pop";
  pop.innerHTML = [["want", "Optional only"], ["need", "Essential only"]].map(([k, v]) => `<button class="opt ${S.need === k ? "cur" : ""}" data-need="${k}">${v}${S.need === k ? " ✓" : ""}</button>`).join("") +
    `<hr>` + S.cats.map((c) => `<button class="opt ${c.name === S.category ? "cur" : ""}" data-name="${esc(c.name)}"><i class="dot" style="background:${col(c.color)}"></i>${esc(c.name)}${c.name === S.category ? " ✓" : ""}</button>`).join("");
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  pop.style.top = `${Math.max(8, Math.min(r.bottom + 6, innerHeight - pop.offsetHeight - 8))}px`;
  pop.style.left = `${Math.max(8, Math.min(r.right - 240, innerWidth - 248))}px`;
  pop.querySelectorAll("[data-need]").forEach((b) => b.onclick = () => { closePop(); S.need = S.need === b.dataset.need ? null : b.dataset.need; S.offset = 0; renderHero(); loadTx(); });
  pop.querySelectorAll("[data-name]").forEach((b) => b.onclick = () => { closePop(); S.category = S.category === b.dataset.name ? null : b.dataset.name; S.offset = 0; renderCats(); loadTx(); });

// ---------- category picker ----------
function closePop() { document.querySelectorAll(".pop").forEach((p) => p.remove()); }
document.addEventListener("click", (e) => { if (!e.target.closest(".pop")) closePop(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closePop(); closeModal(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { const q = $("#tq"); if (q) { e.preventDefault(); q.focus(); q.select(); } }

function catPicker(anchor, tx) {
  closePop();
  const pop = document.createElement("div");
  pop.className = "pop";
  pop.innerHTML = (tx.category_review ? `<div class="note" style="padding:6px 8px">AI guessed ${esc(tx.category)}${tx.category_confidence != null ? ` (${Math.round(tx.category_confidence * 100)}% sure)` : ""}. Pick the right one, even if it's the same, to confirm.</div>` : "") +
    S.cats.map((c) => `<button class="opt ${c.name === tx.category ? "cur" : ""}" data-name="${esc(c.name)}"><i class="dot" style="background:${col(c.color)}"></i>${esc(c.name)}${c.name === tx.category ? " ✓" : ""}</button>`).join("") +
    `<label><input type="checkbox" id="allm" ${tx.source === "recurring" ? "" : "checked"}> Use for every “${esc(tx.merchant.slice(0, 22))}” purchase</label>` +
    `<div class="needrow"><span>Usually</span><div class="seg"><button type="button" data-need="1" class="${tx.need === true ? "on" : ""}">Need</button><button type="button" data-need="0" class="${tx.need === false ? "on" : ""}">Want</button></div>
      <small>${tx.need_source === "ai" ? "AI's call" : tx.need_source === "category" ? "from category" : tx.need_source === "user" ? "your call" : "not rated"}</small></div>`;
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const top = Math.min(r.bottom + 6, innerHeight - pop.offsetHeight - 8);
  pop.style.top = `${Math.max(8, top)}px`;
  pop.style.left = `${Math.max(8, Math.min(r.right - 240, innerWidth - 248))}px`;
  pop.querySelectorAll("[data-need]").forEach((b) => b.onclick = async (e) => {

    await loadMonth();
  });
  pop.querySelectorAll(".opt").forEach((b) => b.onclick = async () => {
    const all = $("#allm", pop).checked;
    closePop();
    await api(`/tx/${tx.id}`, { method: "PATCH", body: { category: b.dataset.name, apply_to_merchant: all } });
    toast(all ? `All “${tx.merchant}” purchases → ${b.dataset.name}` : `Moved to ${b.dataset.name}`);
    await Promise.all([loadMonth(), loadTrend()]);

// ---------- modals ----------
function closeModal() { const m = $(".scrim"); if (m) m.remove(); }
function modal(html, onMount) {
  closeModal();
  const s = document.createElement("div");
  s.className = "scrim";
  s.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  s.onclick = (e) => { if (e.target === s) closeModal(); };
  document.body.appendChild(s);
  onMount($(".modal", s));
  const f = s.querySelector("input:not([type=checkbox])"); if (f) f.focus();
}
const catOptions = (sel, auto = true) => (auto ? `<option value="">Auto (learned / AI)</option>` : `<option value="">None</option>`) +
  S.cats.map((c) => `<option ${c.name === sel ? "selected" : ""}>${esc(c.name)}</option>`).join("");

function openTxModal(tx) {
  const edit = !!tx;
  const now = new Date(); const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  modal(`${edit ? `<h3>Edit purchase</h3>` : kindSwitch("spend")}
    <form id="tf">
      <div class="row2">
        <label class="field"><span>Amount</span><input name="amount" inputmode="decimal" required value="${edit ? tx.full_amount.toFixed(2) : ""}" placeholder="0.00"></label>
        <label class="field"><span>When</span><input name="ts" type="datetime-local" required value="${edit ? tx.ts.slice(0, 16) : local}"></label>
      </div>
      <label class="field"><span>Merchant</span><input name="merchant" required value="${edit ? esc(tx.merchant) : ""}" placeholder="e.g. Costco"></label>
      <div class="row2">
        <label class="field"><span>Category</span><select name="category">${edit ? S.cats.map((c) => `<option ${c.name === tx.category ? "selected" : ""}>${esc(c.name)}</option>`).join("") : catOptions()}</select></label>
        <label class="field"><span>Card</span><input name="card" value="${edit ? esc(tx.card) : ""}" placeholder="Visa, Cash…"></label>
      </div>
      <label class="field"><span>Note</span><input name="note" value="${edit ? esc(tx.note) : ""}" placeholder="Optional"></label>
      ${edit && tx.full_amount > 0 ? `<div class="field"><span>Split with others · <span id="myshare"></span></span><div id="shl"></div>
        <div class="shadd"><input id="shp" placeholder="Who owes you" aria-label="Who owes you"><input id="sha" class="num" inputmode="decimal" placeholder="Their share" aria-label="Their share">
          <button type="button" class="btn secondary" id="shhalf" title="Half the bill">½</button><button type="button" class="btn secondary" id="shadd">Add</button></div></div>` : ""}
      ${edit ? `<p class="note">The amount is what the card was charged. Use a negative amount for a refund.${tx.full_amount > 0 ? " Shares split off here count against the other person, not your budget." : ""}</p>` : ""}
      <div class="actions">
        ${edit ? `<button type="button" class="btn danger left" id="del">Delete</button>` : ""}
        <button type="button" class="btn secondary" id="cancel">Cancel</button>
        <button class="btn">${edit ? "Save" : "Add"}</button>
      </div>
    </form>`, (m) => {
    bindKindSwitch(m);
    $("#cancel", m).onclick = closeModal;
    if (edit && tx.full_amount > 0) bindShares(m, tx);
    if (edit) $("#del", m).onclick = async () => {
      if (!confirm(`Delete ${tx.merchant} ${money(tx.full_amount)}?${tx.shared ? " Its split shares go too." : ""}`)) return;
      await api(`/tx/${tx.id}`, { method: "DELETE" }); closeModal(); toast("Deleted"); refreshAll();
    };
    $("#tf", m).onsubmit = async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const ts = f.ts.length === 16 ? f.ts + ":00" : f.ts;
      if (edit) {
        const body = { amount: f.amount, merchant: f.merchant, card: f.card, note: f.note };
        if (f.ts !== tx.ts.slice(0, 16)) body.ts = ts;
        if (f.category !== tx.category) body.category = f.category;
        await api(`/tx/${tx.id}`, { method: "PATCH", body });
      } else {
        await api("/tx", { method: "POST", body: { amount: f.amount, ts, merchant: f.merchant, card: f.card, note: f.note, category: f.category || null, source: "manual" } });
      }
      closeModal(); toast(edit ? "Saved" : "Added");
      if (ts.slice(0, 7) !== S.month) { S.month = ts.slice(0, 7); S.day = S.category = null; }
      await refreshAll();
      if (!edit && !f.category) setTimeout(() => loadMonth(), 2500); // pick up the AI category
    };
  });
}

// Split section of the purchase modal: changes save right away
function bindShares(m, tx) {
  let list = [];
  const left = () => Math.round((tx.full_amount - list.reduce((a, x) => a + x.amount, 0)) * 100) / 100;
  const draw = () => {
    $("#myshare", m).innerHTML = list.length ? `your share <b class="num">${money(left())}</b> of ${money(tx.full_amount)}` : "nobody yet";
    $("#shl", m).innerHTML = list.map((x) => `<div class="owe"><div class="m"><b>${esc(x.person)}</b><small>${x.paid ? `paid back ${fmtDay(x.paid_day, { month: "short", day: "numeric" })}${x.from_statement ? " · from statement" : ""}` : "still owes you"}</small></div>
        <span class="num">${money(x.amount)}</span>
        <span><button type="button" class="ghost" data-tog="${x.id}">${x.paid ? "Undo paid" : "Paid"}</button><button type="button" class="ghost" data-rm="${x.id}" aria-label="Remove">✕</button></span></div>`).join("");

async function importPreview(req, fname) {
  const pv = await api("/import/preview", { method: "POST", body: req });

  pv.rows.forEach((r) => { if (r.action !== "seen") actions[r.i] = r.action; if (r.payback) paybacks[r.i] = r.payback.target; });

  const select = (r) => {
    const o = [["purchase", r.money_in ? "Add as refund" : "Add as purchase"]];
    if (r.money_in) o.push(["income", "Add as income"]);
    if (r.money_in && targets(r).length) o.push(["payback", "Paid me back"]);
    if (r.match) o.push(["matched", "Already logged"]);
    o.push(["skip", "Skip"]);

    return `<select data-i="${r.i}" aria-label="What to do">${o.map(([v, l]) => `<option value="${v}" ${actions[r.i] === v ? "selected" : ""}>${l}</option>`).join("")}</select>${pb}`;
  };
  const line = (r) => {
    const sub = r.match
      ? `${r.match.kind === "income" ? "Logged income" : "Logged"}: ${esc(r.match.name)}, ${fmtDay(r.match.ts.slice(0, 10))}${r.fix !== null ? ` · amount → ${money(r.fix)} (was ${money(r.match.amount)})` : ""}`

      <span class="num ${r.money_in ? "pos" : ""}">${r.money_in ? "+" : ""}${money(Math.abs(r.amount))}</span>

  };
  const groups = [
    ["New", pv.rows.filter((r) => r.action === "purchase" || r.action === "income"), true],
    ["Paid back", pv.rows.filter((r) => r.action === "payback"), true],
    ["Skipped", pv.rows.filter((r) => r.action === "skip"), true],
    ["Already logged", pv.rows.filter((r) => r.action === "matched"), false],
    ["Imported before", pv.rows.filter((r) => r.action === "seen"), false],
  ].filter((g) => g[1].length);
  const n = pv.counts;
  const long = { month: "short", day: "numeric", year: "numeric" };
  const order = { mdy: "MM/DD/YYYY", dmy: "DD/MM/YYYY", ymd: "YYYY-MM-DD", text: "written-out dates" }[pv.date_order];
  modal(`<h3>Import into ${esc(pv.account)}</h3>

    <div class="toolbar">${[["new", (n.purchase || 0) + (n.income || 0)], ["paid back", n.payback], ["already logged", n.matched], ["skipped", n.skip], ["imported before", n.seen]]
      .filter((x) => x[1]).map(([k, v]) => `<span class="chip">${v} <b>${k}</b></span>`).join("")}</div>
    <p class="note">Dates read as ${order}${pv.ambiguous_dates ? ` (could be ${pv.date_order === "mdy" ? "DD/MM" : "MM/DD"}: <a href="#" id="swapd">switch</a>)` : ""}.
      Money in is green. Amounts backwards? <a href="#" id="flip">Flip them</a>.
      ${!pv.balance ? "" : pv.balance.newer_balance_day
        ? `<br>Records the statement balance, ${money(pv.balance.amount)} on ${fmtDay(pv.balance.day, long)}, in the history. Your ${fmtDay(pv.balance.newer_balance_day, { month: "short", day: "numeric" })} balance is newer and stays current.`
        : `<br>Sets the ${esc(pv.account)} balance to ${money(pv.balance.amount)} as of ${fmtDay(pv.balance.day, long)}.`}
      ${pv.warnings.length ? `<br><span class="up">${pv.warnings.length} line${pv.warnings.length === 1 ? "" : "s"} couldn't be read${S.hideAll ? "" : `, e.g. ${esc(pv.warnings[0])}`}</span>` : ""}</p>
    ${groups.map(([title, rows, open]) => `<details class="impg" ${open ? "open" : ""}><summary>${title} · ${rows.length}</summary>${rows.map(line).join("")}</details>`).join("")}
    <div class="actions"><button type="button" class="btn secondary" id="cancel">Cancel</button><button type="button" class="btn" id="go"></button></div>`, (m) => {

    m.querySelectorAll("select[data-pb]").forEach((s) => s.onchange = () => { paybacks[s.dataset.pb] = s.value; });

    $("#go", m).onclick = async () => {
      const go = $("#go", m); go.disabled = true;
      try {
        const pbs = Object.fromEntries(Object.entries(paybacks).filter(([i]) => actions[i] === "payback"));
        const r = await api("/import/commit", { method: "POST", body: { ...req, actions, paybacks: pbs } });
        closeModal();
        toast([r.purchase && `${r.purchase} purchase${r.purchase === 1 ? "" : "s"}`, r.income && `${r.income} income`,
          r.matched && `${r.matched} matched`, r.payback && `${r.payback} paid back`, r.fixed && `${r.fixed} amount${r.fixed === 1 ? "" : "s"} corrected`].filter(Boolean).join(" · ") || "Saved");
        refreshAll();
      } finally { go.disabled = false; }
    };
  });
}

// ---------- recurring ----------
// every date this schedule falls on between two days, both included
function occurrences(x, from, to) {
  const out = [];
  if (x.freq === "monthly") {
    let ym = from.slice(0, 7);
    while (ym <= to.slice(0, 7)) {
      const [y, m] = ym.split("-").map(Number), dim = new Date(y, m, 0).getDate();
      const d = `${ym}-${String(Math.min(x.day, dim)).padStart(2, "0")}`;
      if (d >= from && d <= to) out.push(d);
      ym = shiftYm(ym, 1);
    }
    return out;
  }
  if (!x.anchor) return out;
  const step = x.freq === "weekly" ? 7 : 14;
  for (let d = x.anchor; d <= to; d = addDays(d, step)) if (d >= from) out.push(d);
  return out;
}
function renderRecurring() {
  const el = $("#reccard");
  if (!el) return;
  const r = [...S.recurring].sort((a, b) => (a.kind === b.kind ? b.amount - a.amount : a.kind === "income" ? -1 : 1));
  const perMonth = (x) => x.amount * (x.freq === "weekly" ? 52 / 12 : x.freq === "biweekly" ? 26 / 12 : 1);
  const live = r.filter((x) => x.active), paused = r.filter((x) => !x.active);
  const total = (k) => live.filter((x) => x.kind === k).reduce((a, x) => a + perMonth(x), 0);
  const inc = total("income"), sp = total("spend");
  const today = localToday(), ym = today.slice(0, 7), [y, m] = ym.split("-").map(Number), dim = new Date(y, m, 0).getDate();
  const monthEnd = `${ym}-${String(dim).padStart(2, "0")}`;
  const thisMonth = live.flatMap((x) => occurrences(x, `${ym}-01`, monthEnd).map((date) => ({ x, date }))).sort((a, b) => a.date.localeCompare(b.date));
  const upcoming = live.flatMap((x) => occurrences(x, today, addDays(today, 30)).map((date) => ({ x, date }))).sort((a, b) => a.date.localeCompare(b.date));
  const done = thisMonth.filter((o) => o.date < today).reverse();
  const stillOut = thisMonth.filter((o) => o.date >= today && o.x.kind === "spend").reduce((a, o) => a + o.x.amount, 0);
  const stillIn = thisMonth.filter((o) => o.date >= today && o.x.kind === "income").reduce((a, o) => a + o.x.amount, 0);
  const nextOut = upcoming.find((o) => o.x.kind === "spend");
  const inDays = (d) => { const n = -daysAgo(d); return n === 0 ? "today" : n === 1 ? "tomorrow" : `in ${n} days`; };
  const dot = (x) => { const c = S.cats.find((k) => k.name === x.category); return x.kind === "income" ? "var(--good)" : c ? col(c.color) : "var(--gold)"; };
  const sign = (x) => (x.kind === "income" ? "+" : "−");
  const marks = thisMonth.map((o) => {
    const left = ((+o.date.slice(8) - 1) / Math.max(1, dim - 1)) * 100, past = o.date < today;
    return `<span class="rm ${o.x.kind} ${past ? "done" : ""}" style="left:${left}%;--c:${dot(o.x)}" data-tip="${esc(o.x.name)} · ${fmtDay(o.date, { month: "short", day: "numeric" })} · ${sign(o.x)}${money(o.x.amount)}${past ? " · logged" : ""}"></span>`;
  }).join("");
  const nowAt = ((+today.slice(8) - 1) / Math.max(1, dim - 1)) * 100;
  const days = [1, 5, 10, 15, 20, 25, dim].map((d) => `<span style="left:${((d - 1) / Math.max(1, dim - 1)) * 100}%">${d}</span>`).join("");
  const line = (o, status) => `<div class="uline ${o.x.kind}">${dateTile(o.date)}
      <div class="um"><b>${esc(o.x.name)}</b><small>${status}</small></div>
      <span class="num ${o.x.kind === "income" ? "pos" : ""}">${sign(o.x)}${money(o.x.amount)}</span></div>`;
  const sched = (list, title, sum) => list.length ? `<div class="sc-h"><span>${title}</span><b class="num">${money(sum, true)}/mo</b></div>` + list.map((x) => `<div class="sline"><i class="dot" style="background:${dot(x)}"></i>
      <div class="um"><b>${esc(x.name)}</b><small>${esc(freqText(x))}</small></div>
      <span class="sshare"><u style="width:${pct100((perMonth(x) / Math.max(1, sum)) * 100)}%;background:${dot(x)}"></u></span>
      <span class="num ${x.kind === "income" ? "pos" : ""}">${x.kind === "income" ? "+" : ""}${money(x.amount)}</span>
      <button class="more3" data-rec="${x.id}" aria-label="Edit ${esc(x.name)}">•••</button></div>`).join("") : "";
  const subs = S.subs || [];
  const per = { weekly: "weekly", biweekly: "every 2 weeks", monthly: "monthly" };
  el.innerHTML = `<div class="ribbon">${ribbon([
      { k: "Coming in", v: `+${money(inc, true)}`, d: "per month (weekly ≈ ×4.33)", tone: "pos" },
      { k: "Going out", v: money(sp, true), d: `${live.filter((x) => x.kind === "spend").length} active payments` },
      { k: "Left after bills", v: signed(inc - sp, true), d: inc ? `${Math.round((sp / inc) * 100)}% of income is committed` : "no recurring income", tone: inc - sp >= 0 ? "pos" : "up" },
      { k: "Still to pay", v: money(stillOut, true), d: `by ${fmtDay(monthEnd, { month: "short", day: "numeric" })}${stillIn ? ` · +${money(stillIn, true)} to come` : ""}` },
      { k: "Next payment", v: nextOut ? inDays(nextOut.date) : "—", d: nextOut ? `${esc(nextOut.x.name)} · ${money(nextOut.x.amount)}` : "nothing scheduled" },
    ])}</div>
    <section class="card lift rec-rail"><div class="chart-h"><h2>${fmtDay(`${ym}-15`, { month: "long" })} at a glance</h2><span class="legendrow" style="margin:0"><span><i class="dot" style="background:var(--good)"></i>Income</span><span><i class="dot" style="background:var(--gold)"></i>Payment</span><span><i class="dot hollow"></i>Logged</span></span>
        <button class="btn dark" id="addrec" style="margin-left:auto">${ICON.plus}Add recurring</button></div>
      <div class="rail"><div class="rail-line"><i style="width:${nowAt}%"></i></div><span class="rnow" style="left:${nowAt}%"><em>Today</em></span>${marks}</div><div class="rail-days num">${days}</div></section>
    <div class="rec-cols">
      <section class="card rc"><h2>Upcoming <span class="right note">next 30 days</span></h2><div class="rc-b">${upcoming.map((o) => line(o, inDays(o.date))).join("") || `<div class="empty" style="padding:12px 0">Nothing due in the next 30 days.</div>`}</div></section>
      <section class="card rc rc-mid"><h2>Active schedule <span class="right note num">${live.length}</span></h2>
        ${inc ? `<div class="commit">${gauge((sp / inc) * 100, "var(--gold)", null, `${Math.round((sp / inc) * 100)}%`, "committed", 104)}<div><div class="note-h">Of what comes in every month</div><div class="commit-v num">${money(sp, true)} <small>of ${money(inc, true)}</small></div><div class="splitbar"><i style="width:${pct100((sp / inc) * 100)}%;background:var(--gold)"></i><i style="flex:1;background:var(--accent)"></i></div><div class="note-h num" style="margin-top:4px">${money(inc - sp, true)} free after recurring payments</div></div></div>` : ""}
        <div class="rc-b">${r.length ? sched(live.filter((x) => x.kind === "income"), "Income", inc) + sched(live.filter((x) => x.kind === "spend"), "Payments", sp) : `<div class="empty" style="padding:12px 0">Paycheque, gym, iCloud, phone… add them once and they're logged automatically.</div>`}
        ${paused.length ? `<div class="sc-h"><span>Paused</span><b class="num">${paused.length}</b></div>${paused.map((x) => `<div class="sline paused"><i class="dot" style="background:var(--axis)"></i><div class="um"><b>${esc(x.name)}</b><small>${esc(freqText(x))} · paused</small></div><span></span><span class="num">${money(x.amount)}</span><button class="more3" data-rec="${x.id}" aria-label="Edit ${esc(x.name)}">•••</button></div>`).join("")}` : ""}</div></section>
      <section class="card rc"><h2>Done this month <span class="right note num">${done.length}</span></h2><div class="rc-b">${done.map((o) => line(o, "logged")).join("") || `<div class="note">Nothing logged yet this month.</div>`}
        ${subs.length ? `<div class="sc-h" style="margin-top:12px"><span>Looks like a subscription</span><b class="num">${subs.length}</b></div>` + subs.map((x) => `<div class="sugg"><div><b style="font-weight:500">${esc(x.name)}</b>
          <small>${money(x.amount)} ${per[x.freq]} · ${x.charges} charges since ${fmtDay(x.first, { month: "short", day: "numeric" })} · next ~${fmtDay(x.next, { month: "short", day: "numeric" })}</small></div>
          <button class="btn secondary" data-sacc="${esc(x.merchant_key)}" style="padding:4px 10px">Add</button>
          <button class="ghost" data-sdis="${esc(x.merchant_key)}" aria-label="Not a subscription" title="Not a subscription">✕</button></div>`).join("") +
        `<div class="note" style="margin-top:6px">Found from repeat charges${S.settings.ai_enabled ? ", checked by AI" : ""}. Add logs it from the next charge on.</div>` : ""}</div></section>
    </div>`;
  $("#addrec").onclick = () => openRecModal();
  el.querySelectorAll("[data-tip]").forEach((x) => hoverTip(x, () => x.dataset.tip));
  el.querySelectorAll("[data-rec]").forEach((b) => b.onclick = () => openRecModal(r.find((x) => x.id === +b.dataset.rec)));
  el.querySelectorAll("[data-sacc]").forEach((b) => b.onclick = async () => {
    const x = subs.find((s) => s.merchant_key === b.dataset.sacc);
    await api(`/subscriptions/${encodeURIComponent(x.merchant_key)}/accept`, { method: "POST" });
    toast(`${x.name} added as recurring`); refreshAll();
  });
  el.querySelectorAll("[data-sdis]").forEach((b) => b.onclick = async () => {
    await api(`/subscriptions/${encodeURIComponent(b.dataset.sdis)}/dismiss`, { method: "POST" });
    S.subs = subs.filter((s) => s.merchant_key !== b.dataset.sdis); renderRecurring();
  });
}
const ordinal = (n) => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
const weekday = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-CA", { weekday: "long" });
const freqText = (x) => x.freq === "weekly" ? `every ${weekday(x.anchor)}` : x.freq === "biweekly" ? `every other ${weekday(x.anchor)}` : `${ordinal(x.day)} monthly`;

function openRecModal(rec) {
  const edit = !!rec;
  const kind = edit ? rec.kind : "spend";
  const freq = edit ? rec.freq : "monthly";
  modal(`<h3>${edit ? (kind === "income" ? "Recurring income" : "Recurring payment") : "Add recurring"}</h3>
    <form id="rf">
      ${edit ? "" : `<div class="seg" id="rkind"><button type="button" data-k="spend" class="on">Payment</button><button type="button" data-k="income">Income</button></div>`}
      <label class="field"><span id="rname">${kind === "income" ? "From" : "Name"}</span><input name="name" required value="${edit ? esc(rec.name) : ""}" placeholder="${kind === "income" ? "e.g. Paycheque" : "e.g. iCloud+"}"></label>
      <div class="row2">
        <label class="field"><span>Amount</span><input name="amount" inputmode="decimal" required value="${edit ? rec.amount.toFixed(2) : ""}" placeholder="0.00"></label>
        <label class="field"><span>Repeats</span><select name="freq">
          ${[["monthly", "Monthly"], ["weekly", "Every week"], ["biweekly", "Every 2 weeks"]].map(([k, v]) => `<option value="${k}" ${freq === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      </div>
      <div class="row2">
        <label class="field" data-show="monthly"><span>Day of month</span><input name="day" type="number" min="1" max="31" value="${edit && freq === "monthly" ? rec.day : ""}" placeholder="1–31"></label>
        <label class="field" data-show="weekly"><span>First date</span><input name="anchor" type="date" value="${edit && rec.anchor ? rec.anchor : localToday()}"></label>
        <label class="field" data-kindshow="spend"><span>Category</span><select name="category">${catOptions(edit ? rec.category : null, false)}</select></label>
        <label class="field" data-kindshow="income"><span>Into account</span><select name="account_id">${accOptions(edit ? rec.account_id : S.settings.income_account)}</select></label>
      </div>
      <label class="field" data-kindshow="spend"><span>Card</span><input name="card" value="${edit ? esc(rec.card) : ""}" placeholder="Optional"></label>
      <p class="note" data-show="weekly">Every occurrence from the first date on is logged, including past ones.</p>
      ${edit ? `<p class="note">Changes apply from now on. Past entries stay as they are; edit them in the list if needed.</p>`
        : `<label style="display:flex;gap:8px;align-items:center;margin-bottom:12px" class="note" data-show="monthly"><input type="checkbox" name="log_this_month" checked> Also log this month's if that day has passed</label>`}
      <div class="actions">
        ${edit ? `<button type="button" class="btn danger left" id="del">Remove</button><button type="button" class="btn secondary" id="pause">${rec.active ? "Pause" : "Resume"}</button>` : `<button type="button" class="btn secondary" id="cancel">Cancel</button>`}
        <button class="btn">${edit ? "Save" : "Add"}</button>
      </div>
    </form>`, (m) => {
    let k = kind;
    const sync = () => {
      const fq = $("[name=freq]", m).value;
      m.querySelectorAll("[data-show]").forEach((el) => (el.style.display = (el.dataset.show === "monthly") === (fq === "monthly") ? "" : "none"));
      m.querySelectorAll("[data-kindshow]").forEach((el) => (el.style.display = el.dataset.kindshow === k ? "" : "none"));
      $("[name=day]", m).required = fq === "monthly";
      $("#rname", m).textContent = k === "income" ? "From" : "Name";
    };
    $("[name=freq]", m).onchange = sync;
    m.querySelectorAll("#rkind [data-k]").forEach((b) => b.onclick = () => {
      k = b.dataset.k; m.querySelectorAll("#rkind [data-k]").forEach((x) => x.classList.toggle("on", x === b)); sync();
    });
    sync();
    if (!edit) $("#cancel", m).onclick = closeModal;
    if (edit) {
      $("#del", m).onclick = async () => { if (!confirm(`Stop logging ${rec.name}? Past entries are kept.`)) return; await api(`/recurring/${rec.id}`, { method: "DELETE" }); closeModal(); loadRecurring(); };
      $("#pause", m).onclick = async () => { await api(`/recurring/${rec.id}`, { method: "PATCH", body: { active: !rec.active } }); closeModal(); refreshAll(); };
    }
    $("#rf", m).onsubmit = async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const weekly = f.freq !== "monthly";
      const body = { name: f.name, amount: f.amount, freq: f.freq, card: f.card || "" };
      if (weekly) body.anchor = f.anchor; else body.day = +f.day;
      if (k === "income") body.account_id = f.account_id ? +f.account_id : (edit ? 0 : null);
      else body.category = f.category || (edit ? "" : null);
      if (edit) await api(`/recurring/${rec.id}`, { method: "PATCH", body });
      else await api("/recurring", { method: "POST", body: { ...body, kind: k, log_this_month: !!f.log_this_month } });
      closeModal(); toast(edit ? "Saved" : "Added"); refreshAll();
    };
  });
}

// ---------- settings ----------
function renderSettings() {
  const el = $("#v-settings"), s = S.settings;
  if (!el || !S.cats) return;
  const used = S.cats.filter((c) => c.name !== "Other").length;
  const stat = Object.fromEntries((S.stats?.categories || []).map((c) => [c.name, c]));
  const catRows = () => `<div class="cat-edit head"><span></span><span>Name</span><span>Budget</span><span>${esc(S.stats?.label.split(" ")[0] || "")}</span><span></span></div>` + S.cats.map((c) => `<div class="cat-edit" data-name="${esc(c.name)}">
      <button type="button" class="swatch" style="background:${col(c.color)}" aria-label="Color for ${esc(c.name)}" ${c.name === "Other" ? "disabled" : ""}></button>
      <input value="${esc(c.name)}" class="cname" aria-label="Category name" ${c.name === "Other" ? "disabled" : ""}>
      <span class="num">${stat[c.name]?.budget ? money(stat[c.name].budget, true) : "—"}</span>
      <span class="num">${stat[c.name]?.total ? money(stat[c.name].total, true) : "—"}</span>
      ${c.name === "Other" ? "<span></span>" : `<button type="button" class="ghost cdel" aria-label="Delete ${esc(c.name)}">✕</button>`}
    </div>`).join("");
  el.innerHTML = `<div class="set-grid">
    <section class="card lift set-cats">
      <div class="set-h"><div><h2>Categories</h2><p class="note">Color and name. Colors stay with the category everywhere in the app. Budgets are under <a href="#budgets">Budgets</a>.</p></div><span class="tag num">${used + 1}</span></div>
      <div id="ced">${catRows()}</div>
      <div class="set-add"><input id="newcat" placeholder="New category" aria-label="New category"><button type="button" class="btn dark" id="addcat">${ICON.plus}Add</button></div>
    </section>
    <div class="set-side">
      <section class="card set-row"><div class="set-t"><h2>Appearance</h2><p class="note">Stored on this device.</p></div>
        <div class="seg2 set-seg"><button id="sdark" class="${isDark() ? "on" : ""}">Dark</button><button id="slight" class="${isDark() ? "" : "on"}">Light</button></div></section>
      <section class="card set-row"><div class="set-t"><h2>Income goes into</h2><p class="note">Used unless you pick another account.</p></div>
        <select id="incacc" class="pick wide" aria-label="Income goes into">${accOptions(s.income_account)}</select></section>
      <section class="card set-block"><div class="set-t"><h2>Auto-categorizing</h2><span class="tag ${s.ai_enabled ? "good" : ""}">${s.ai_enabled ? "On" : "Rules only"}</span></div>
        <p class="note">${s.ai_enabled ? `Running on ${esc(s.ai_model)}. New merchants get a category automatically; ones it's unsure about (under ${Math.round((s.ai_review_below || 0.75) * 100)}%) are marked AI? for you to confirm. Your corrections always win.` : "Keyword rules only. Add OPENAI_API_KEY (or ANTHROPIC_API_KEY) to the server's .env to turn on AI."}</p></section>
      <section class="card set-block"><div class="set-t"><h2>Weekly summary</h2><span class="tag ${s.weekly_summary ? "good" : ""}">${s.weekly_summary ? "On" : "Off"}</span></div>
        <p class="note">${s.weekly_summary ? "A push notification every Sunday at 7pm with the week's spending, budgets and what needs doing." : "Set NTFY_URL and NTFY_TOKEN in the server's .env to turn it on."}</p>
        ${s.weekly_summary ? `<button type="button" class="btn dark" id="wktest">Send one now</button>` : ""}</section>
      <section class="card set-block"><div class="set-t"><h2>This device</h2><span class="tag">${s.trusted_device ? "Trusted" : "Signed in"}</span></div>
        <p class="note">${s.trusted_device ? "This device opens without a token over Tailscale. To change that, edit TRUSTED_DEVICES in the server's .env." : "Your API token is stored in this browser only."}</p>
        ${s.trusted_device ? "" : `<button type="button" class="btn dark" id="logout">Sign out</button>`}</section>
    </div></div>`;
  const reload = async () => { S.cats = await api("/categories"); await refreshAll(); renderSettings(); };
  el.querySelectorAll(".cdel").forEach((b) => b.onclick = async () => {
    const name = b.closest(".cat-edit").dataset.name;
    if (!confirm(`Delete “${name}”? Its purchases move to Other.`)) return;
    await api(`/categories/${encodeURIComponent(name)}`, { method: "DELETE" });
    await reload();
  });
  el.querySelectorAll(".cname:not([disabled])").forEach((i) => i.onchange = async () => {
    const name = i.closest(".cat-edit").dataset.name, next = i.value.trim();
    if (!next || next === name) { i.value = name; return; }
    await api(`/categories/${encodeURIComponent(name)}`, { method: "PATCH", body: { new_name: next } });
    toast("Saved"); await reload();
  });
  el.querySelectorAll(".swatch:not([disabled])").forEach((b) => b.onclick = (e) => {
    e.stopPropagation(); closePop();
    const name = b.closest(".cat-edit").dataset.name;
    const pop = document.createElement("div"); pop.className = "pop"; pop.style.width = "auto";
    pop.innerHTML = `<div class="swatches">${PALETTE.map((p, i) => `<button class="swatch" data-c="${p[0]}" aria-label="Color ${i + 1}" style="background:${isDark() ? p[1] : p[0]}"></button>`).join("")}</div>`;
    document.body.appendChild(pop);
    const r = b.getBoundingClientRect(); pop.style.top = r.bottom + 6 + "px"; pop.style.left = r.left + "px";
    pop.querySelectorAll("[data-c]").forEach((x) => x.onclick = async () => {
      closePop(); await api(`/categories/${encodeURIComponent(name)}`, { method: "PATCH", body: { color: x.dataset.c } });
      await reload();
    });
  });
  $("#addcat").onclick = async () => {
    const n = $("#newcat").value.trim(); if (!n) return;
    await api("/categories", { method: "POST", body: { name: n } });
    await reload();
  };
  $("#newcat").onkeydown = (e) => { if (e.key === "Enter") $("#addcat").click(); };
  $("#incacc").onchange = async (e) => { await api("/settings", { method: "PUT", body: { income_account: +e.target.value || null } }); S.settings = await api("/settings"); toast("Saved"); };
  const theme = (t) => () => { $("#" + (t === "dark" ? "tdark" : "tlight")).click(); renderSettings(); };
  $("#sdark").onclick = theme("dark"); $("#slight").onclick = theme("light");
  const wt = $("#wktest"); if (wt) wt.onclick = async () => {
    wt.textContent = "Sending…";
    try { await api("/summary/weekly/send", { method: "POST" }); toast("Sent. Check your phone"); } finally { wt.textContent = "Send one now"; }
  };
  const lo = $("#logout"); if (lo) lo.onclick = () => { store.del("spend_token"); TOKEN = ""; renderLogin(); };
}

// ---------- tooltip ----------
const tip = $("#tip");
function hoverTip(el, html) {
  el.addEventListener("mouseenter", () => { tip.innerHTML = html(); tip.style.opacity = 1; });
  el.addEventListener("mousemove", (e) => {
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 12) + "px";
    tip.style.top = Math.max(8, e.clientY - h - 12) + "px";
  });
  el.addEventListener("mouseleave", () => (tip.style.opacity = 0));
  el.addEventListener("click", () => (tip.style.opacity = 0));
}

// ---------- go ----------
const savedTheme = store.get("spend_theme"); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
const qsMonth = new URLSearchParams(location.search).get("month"); if (qsMonth) S.month = qsMonth;
boot();
</script>
</body>
</html>
