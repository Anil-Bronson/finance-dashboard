async function importPreview(req, fname) {
  const pv = await api("/import/preview", { method: "POST", body: req });
  const actions = {}, paybacks = {};
  pv.rows.forEach((r) => { if (r.action !== "seen") actions[r.i] = r.action; if (r.payback) paybacks[r.i] = r.payback.target; });
  const targets = (r) => [...(r.payback && r.payback.target.startsWith("share:") ? [r.payback] : []), ...(r.payback_options || [])];
  const select = (r) => {
    const o = [["purchase", r.money_in ? "Add as refund" : "Add as purchase"]];
    if (r.money_in) o.push(["income", "Add as income"]);
    if (r.money_in && targets(r).length) o.push(["payback", "Paid me back"]);
    if (r.match) o.push(["matched", "Already logged"]);
    o.push(["skip", "Skip"]);
    const pb = targets(r).length ? `<select data-pb="${r.i}" aria-label="Which purchase" ${actions[r.i] === "payback" ? "" : "hidden"}>${targets(r).map((t) =>
      `<option value="${t.target}" ${paybacks[r.i] === t.target ? "selected" : ""}>${t.target.startsWith("share:") ? `${esc(t.person)}'s IOU: ` : "Share of "}${esc(t.name)} · ${fmtDay(t.date, { month: "short", day: "numeric" })} · ${money(t.amount)}</option>`).join("")}</select>` : "";
    return `<select data-i="${r.i}" aria-label="What to do">${o.map(([v, l]) => `<option value="${v}" ${actions[r.i] === v ? "selected" : ""}>${l}</option>`).join("")}</select>${pb}`;
  };
  const line = (r) => {
    const sub = r.match
      ? `${r.match.kind === "income" ? "Logged income" : "Logged"}: ${esc(r.match.name)}, ${fmtDay(r.match.ts.slice(0, 10))}${r.fix !== null ? ` · amount → ${money(r.fix)} (was ${money(r.match.amount)})` : ""}`
      : esc(r.reason);
    return `<div class="imp ${r.ai_unsure ? "unsure" : ""}" ${r.ai_unsure ? `title="The AI wasn't sure. Check this one"` : ""}><span class="note num">${fmtDay(r.date, { month: "short", day: "numeric" })}</span>
      <div class="m"><b>${esc(r.description)}</b>${sub ? `<small>${sub}</small>` : ""}</div>
      <span class="num ${r.money_in ? "pos" : ""}">${r.money_in ? "+" : ""}${money(Math.abs(r.amount))}</span>
      ${r.action === "seen" ? `<span class="note">${esc(r.reason)}</span>` : select(r)}</div>`;
  };
  const groups = [
    ["New", pv.rows.filter((r) => r.action === "purchase" || r.action === "income"), true],
    ["Paid back", pv.rows.filter((r) => r.action === "payback"), true],
    ["Skipped", pv.rows.filter((r) => r.action === "skip"), true],
    ["Already logged", pv.rows.filter((r) => r.action === "matched"), false],
    ["Imported before", pv.rows.filter((r) => r.action === "seen"), false],
  ].filter((g) => g[1].length);
  const n = pv.counts;
  const long = { month: "short", day: "numeric", year: "numeric" };
  const order = { mdy: "MM/DD/YYYY", dmy: "DD/MM/YYYY", ymd: "YYYY-MM-DD", text: "written-out dates" }[pv.date_order];
  modal(`<h3>Import into ${esc(pv.account)}</h3>
    <p class="note" style="margin-top:-8px">${esc(fname)} · ${fmtDay(pv.first_day, long)} – ${fmtDay(pv.last_day, long)} · ${pv.rows.length} rows</p>
    <div class="toolbar">${[["new", (n.purchase || 0) + (n.income || 0)], ["paid back", n.payback], ["already logged", n.matched], ["skipped", n.skip], ["imported before", n.seen]]
      .filter((x) => x[1]).map(([k, v]) => `<span class="chip">${v} <b>${k}</b></span>`).join("")}</div>
    <p class="note">Dates read as ${order}${pv.ambiguous_dates ? ` (could be ${pv.date_order === "mdy" ? "DD/MM" : "MM/DD"}: <a href="#" id="swapd">switch</a>)` : ""}.
      Money in is green. Amounts backwards? <a href="#" id="flip">Flip them</a>.
      ${!pv.balance ? "" : pv.balance.newer_balance_day
        ? `<br>Records the statement balance, ${money(pv.balance.amount)} on ${fmtDay(pv.balance.day, long)}, in the history. Your ${fmtDay(pv.balance.newer_balance_day, { month: "short", day: "numeric" })} balance is newer and stays current.`
        : `<br>Sets the ${esc(pv.account)} balance to ${money(pv.balance.amount)} as of ${fmtDay(pv.balance.day, long)}.`}
      ${pv.warnings.length ? `<br><span class="up">${pv.warnings.length} line${pv.warnings.length === 1 ? "" : "s"} couldn't be read${S.hideAll ? "" : `, e.g. ${esc(pv.warnings[0])}`}</span>` : ""}</p>
    ${groups.map(([title, rows, open]) => `<details class="impg" ${open ? "open" : ""}><summary>${title} · ${rows.length}</summary>${rows.map(line).join("")}</details>`).join("")}
    <div class="actions"><button type="button" class="btn secondary" id="cancel">Cancel</button><button type="button" class="btn" id="go"></button></div>`, (m) => {
    m.classList.add("wide");
    const label = () => {
      const k = Object.values(actions).filter((a) => a === "purchase" || a === "income" || a === "payback").length;
      $("#go", m).textContent = k ? `Import ${k} new` : "Save";  // still links matches, fixes amounts, sets balance
    };
    label();
    m.querySelectorAll("select[data-i]").forEach((s) => s.onchange = () => {
      actions[s.dataset.i] = s.value; label();
      const pb = m.querySelector(`select[data-pb="${s.dataset.i}"]`);
      if (pb) { pb.hidden = s.value !== "payback"; if (s.value === "payback") paybacks[s.dataset.i] = pb.value; }
    });
    m.querySelectorAll("select[data-pb]").forEach((s) => s.onchange = () => { paybacks[s.dataset.pb] = s.value; });
    $("#cancel", m).onclick = closeModal;
    const again = (patch) => (e) => { e.preventDefault(); importPreview({ ...req, ...patch }, fname); };
    $("#flip", m).onclick = again({ flip: !req.flip });
    const sw = $("#swapd", m); if (sw) sw.onclick = again({ date_order: pv.date_order === "mdy" ? "dmy" : "mdy" });
    $("#go", m).onclick = async () => {
      const go = $("#go", m); go.disabled = true;
      try {
        const pbs = Object.fromEntries(Object.entries(paybacks).filter(([i]) => actions[i] === "payback"));
        const r = await api("/import/commit", { method: "POST", body: { ...req, actions, paybacks: pbs } });
        closeModal();
        toast([r.purchase && `${r.purchase} purchase${r.purchase === 1 ? "" : "s"}`, r.income && `${r.income} income`,
          r.matched && `${r.matched} matched`, r.payback && `${r.payback} paid back`, r.fixed && `${r.fixed} amount${r.fixed === 1 ? "" : "s"} corrected`].filter(Boolean).join(" · ") || "Saved");
        refreshAll();
      } finally { go.disabled = false; }
    };
  });
}

// ---------- recurring ----------
function renderRecurring() {
  const r = [...S.recurring].sort((a, b) => (a.kind === b.kind ? 0 : a.kind === "income" ? -1 : 1));
  const perMonth = (x) => x.amount * (x.freq === "weekly" ? 52 / 12 : x.freq === "biweekly" ? 26 / 12 : 1);
  const total = (k) => r.filter((x) => x.active && x.kind === k).reduce((a, x) => a + perMonth(x), 0);
  const inc = total("income"), sp = total("spend");
  $("#rec").innerHTML = r.length ? r.map((x) => {
    const c = S.cats.find((c) => c.name === x.category);
    const dot = x.kind === "income" ? "var(--good)" : col(c?.color);
    return `<div class="rec ${x.active ? "" : "paused"}">
      <div><span style="display:flex;align-items:center;gap:8px"><i class="dot" style="background:${dot}"></i><b style="font-weight:550">${esc(x.name)}</b></span>
      <small>${esc(freqText(x))}${x.active ? "" : " · paused"}</small></div>
      <span class="num ${x.kind === "income" ? "pos" : ""}">${x.kind === "income" ? "+" : ""}${money(x.amount)}</span>
      <button class="ghost" data-rec="${x.id}" aria-label="Edit">⋯</button></div>`;
  }).join("") + `<div class="note" style="margin-top:8px">${[inc ? `<span class="pos">+${money(inc, true)}</span> in` : "", sp ? `${money(sp, true)} out` : ""].filter(Boolean).join(" · ")} per month (weekly ≈ ×4.33)</div>`
    : `<div class="empty" style="padding:12px 0">Paycheque, gym, iCloud, phone… add them once and they're logged automatically.</div>`;
  const subs = S.subs || [];
  const per = { weekly: "weekly", biweekly: "every 2 weeks", monthly: "monthly" };
  if (subs.length) $("#rec").innerHTML += `<div class="acc-group"><span>Looks like a subscription</span><span>${subs.length}</span></div>` +
    subs.map((x) => `<div class="sugg"><div><b style="font-weight:550">${esc(x.name)}</b>
      <small>${money(x.amount)} ${per[x.freq]} · ${x.charges} charges since ${fmtDay(x.first, { month: "short", day: "numeric" })} · next ~${fmtDay(x.next, { month: "short", day: "numeric" })}</small></div>
      <button class="btn secondary" data-sacc="${esc(x.merchant_key)}" style="padding:4px 10px">Add</button>
      <button class="ghost" data-sdis="${esc(x.merchant_key)}" aria-label="Not a subscription" title="Not a subscription">✕</button></div>`).join("") +
    `<div class="note" style="margin-top:6px">Found from repeat charges${S.settings.ai_enabled ? ", checked by AI" : ""}. Add logs it from the next charge on.</div>`;
  $("#rec").querySelectorAll("[data-rec]").forEach((el) => el.onclick = () => openRecModal(r.find((x) => x.id === +el.dataset.rec)));
  $("#rec").querySelectorAll("[data-sacc]").forEach((el) => el.onclick = async () => {
    const x = subs.find((s) => s.merchant_key === el.dataset.sacc);
    await api(`/subscriptions/${encodeURIComponent(x.merchant_key)}/accept`, { method: "POST" });
    toast(`${x.name} added as recurring`); refreshAll();
  });
  $("#rec").querySelectorAll("[data-sdis]").forEach((el) => el.onclick = async () => {
    await api(`/subscriptions/${encodeURIComponent(el.dataset.sdis)}/dismiss`, { method: "POST" });
    S.subs = subs.filter((s) => s.merchant_key !== el.dataset.sdis); renderRecurring();
  });
}
const ordinal = (n) => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
const weekday = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-CA", { weekday: "long" });
const freqText = (x) => x.freq === "weekly" ? `every ${weekday(x.anchor)}` : x.freq === "biweekly" ? `every other ${weekday(x.anchor)}` : `${ordinal(x.day)} monthly`;

function openRecModal(rec) {
  const edit = !!rec;
  const kind = edit ? rec.kind : "spend";
  const freq = edit ? rec.freq : "monthly";
  modal(`<h3>${edit ? (kind === "income" ? "Recurring income" : "Recurring payment") : "Add recurring"}</h3>
    <form id="rf">
      ${edit ? "" : `<div class="seg" id="rkind"><button type="button" data-k="spend" class="on">Payment</button><button type="button" data-k="income">Income</button></div>`}
      <label class="field"><span id="rname">${kind === "income" ? "From" : "Name"}</span><input name="name" required value="${edit ? esc(rec.name) : ""}" placeholder="${kind === "income" ? "e.g. Paycheque" : "e.g. iCloud+"}"></label>
      <div class="row2">
        <label class="field"><span>Amount</span><input name="amount" inputmode="decimal" required value="${edit ? rec.amount.toFixed(2) : ""}" placeholder="0.00"></label>
        <label class="field"><span>Repeats</span><select name="freq">
          ${[["monthly", "Monthly"], ["weekly", "Every week"], ["biweekly", "Every 2 weeks"]].map(([k, v]) => `<option value="${k}" ${freq === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      </div>
      <div class="row2">
        <label class="field" data-show="monthly"><span>Day of month</span><input name="day" type="number" min="1" max="31" value="${edit && freq === "monthly" ? rec.day : ""}" placeholder="1–31"></label>
        <label class="field" data-show="weekly"><span>First date</span><input name="anchor" type="date" value="${edit && rec.anchor ? rec.anchor : localToday()}"></label>
        <label class="field" data-kindshow="spend"><span>Category</span><select name="category">${catOptions(edit ? rec.category : null, false)}</select></label>
        <label class="field" data-kindshow="income"><span>Into account</span><select name="account_id">${accOptions(edit ? rec.account_id : S.settings.income_account)}</select></label>
      </div>
      <label class="field" data-kindshow="spend"><span>Card</span><input name="card" value="${edit ? esc(rec.card) : ""}" placeholder="Optional"></label>
      <p class="note" data-show="weekly">Every occurrence from the first date on is logged, including past ones.</p>
      ${edit ? `<p class="note">Changes apply from now on. Past entries stay as they are; edit them in the list if needed.</p>`
        : `<label style="display:flex;gap:8px;align-items:center;margin-bottom:12px" class="note" data-show="monthly"><input type="checkbox" name="log_this_month" checked> Also log this month's if that day has passed</label>`}
      <div class="actions">
        ${edit ? `<button type="button" class="btn danger left" id="del">Remove</button><button type="button" class="btn secondary" id="pause">${rec.active ? "Pause" : "Resume"}</button>` : `<button type="button" class="btn secondary" id="cancel">Cancel</button>`}
        <button class="btn">${edit ? "Save" : "Add"}</button>
      </div>
    </form>`, (m) => {
    let k = kind;
    const sync = () => {
      const fq = $("[name=freq]", m).value;
      m.querySelectorAll("[data-show]").forEach((el) => (el.style.display = (el.dataset.show === "monthly") === (fq === "monthly") ? "" : "none"));
      m.querySelectorAll("[data-kindshow]").forEach((el) => (el.style.display = el.dataset.kindshow === k ? "" : "none"));
      $("[name=day]", m).required = fq === "monthly";
      $("#rname", m).textContent = k === "income" ? "From" : "Name";
    };
    $("[name=freq]", m).onchange = sync;
    m.querySelectorAll("#rkind [data-k]").forEach((b) => b.onclick = () => {
      k = b.dataset.k; m.querySelectorAll("#rkind [data-k]").forEach((x) => x.classList.toggle("on", x === b)); sync();
    });
    sync();
    if (!edit) $("#cancel", m).onclick = closeModal;
    if (edit) {
      $("#del", m).onclick = async () => { if (!confirm(`Stop logging ${rec.name}? Past entries are kept.`)) return; await api(`/recurring/${rec.id}`, { method: "DELETE" }); closeModal(); loadRecurring(); };
      $("#pause", m).onclick = async () => { await api(`/recurring/${rec.id}`, { method: "PATCH", body: { active: !rec.active } }); closeModal(); refreshAll(); };
    }
    $("#rf", m).onsubmit = async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const weekly = f.freq !== "monthly";
      const body = { name: f.name, amount: f.amount, freq: f.freq, card: f.card || "" };
      if (weekly) body.anchor = f.anchor; else body.day = +f.day;
      if (k === "income") body.account_id = f.account_id ? +f.account_id : (edit ? 0 : null);
      else body.category = f.category || (edit ? "" : null);
      if (edit) await api(`/recurring/${rec.id}`, { method: "PATCH", body });
      else await api("/recurring", { method: "POST", body: { ...body, kind: k, log_this_month: !!f.log_this_month } });
      closeModal(); toast(edit ? "Saved" : "Added"); refreshAll();
    };
  });
}

// ---------- settings ----------
function openSettings() {
  const s = S.settings;
  const catRows = () => S.cats.map((c) => `<div class="cat-edit" data-name="${esc(c.name)}">
      <button type="button" class="swatch" style="background:${col(c.color)}" aria-label="Color" ${c.name === "Other" ? "disabled" : ""}></button>
      <input value="${esc(c.name)}" class="cname" aria-label="Category name" ${c.name === "Other" ? "disabled" : ""}>
      ${c.name === "Other" ? "<span></span>" : `<button type="button" class="ghost cdel" aria-label="Delete">✕</button>`}
    </div>`).join("");
  modal(`<h3>Settings</h3>
    <label class="field"><span>Income goes into (unless you pick another account)</span><select id="incacc">${accOptions(s.income_account)}</select></label>
    <div class="field"><span>Categories · color, name (budgets: Categories card → Budgets)</span><div id="ced">${catRows()}</div>
      <div style="display:flex;gap:8px;margin-top:6px"><input id="newcat" placeholder="New category" style="flex:1;background:var(--field);border:0;border-radius:8px;padding:8px"><button type="button" class="btn secondary" id="addcat">Add</button></div></div>
    <p class="note">Auto-categorizing: ${s.ai_enabled ? `on (${esc(s.ai_model)}). New merchants get a category automatically; ones it's unsure about (under ${Math.round((s.ai_review_below || 0.75) * 100)}%) are marked AI? for you to confirm. Your corrections always win.` : "keyword rules only. Add OPENAI_API_KEY (or ANTHROPIC_API_KEY) to the server's .env to turn on AI."}</p>
    <p class="note">Weekly summary: ${s.weekly_summary ? `on. A push notification every Sunday at 7pm with the week's spending, budgets and what needs doing. <a href="#" id="wktest">Send one now</a>` : "off. Set NTFY_URL and NTFY_TOKEN in the server's .env to turn it on."}</p>
    ${s.trusted_device ? `<p class="note">This device is trusted: it opens without a token over Tailscale. To change that, edit TRUSTED_DEVICES in the server's .env.</p>` : ""}
    <div class="actions">${s.trusted_device ? `<span class="left"></span>` : `<button type="button" class="btn secondary left" id="logout">Sign out</button>`}
      <button type="button" class="btn secondary" id="theme">${isDark() ? "Light" : "Dark"} mode</button>
      <button type="button" class="btn" id="save">Save</button></div>`, (m) => {
    const bind = () => {
      m.querySelectorAll(".cdel").forEach((b) => b.onclick = async () => {
        const name = b.closest(".cat-edit").dataset.name;
        if (!confirm(`Delete “${name}”? Its purchases move to Other.`)) return;
        await api(`/categories/${encodeURIComponent(name)}`, { method: "DELETE" });
        S.cats = await api("/categories"); refreshAll(); $("#ced", m).innerHTML = catRows(); bind();
      });
      m.querySelectorAll(".swatch:not([disabled])").forEach((b) => b.onclick = (e) => {
        e.stopPropagation(); closePop();
        const name = b.closest(".cat-edit").dataset.name;
        const pop = document.createElement("div"); pop.className = "pop"; pop.style.width = "auto";
        pop.innerHTML = `<div class="swatches">${PALETTE.map((p, i) => `<button class="swatch" data-c="${p[0]}" aria-label="Color ${i + 1}" style="background:${isDark() ? p[1] : p[0]}"></button>`).join("")}</div>`;
        document.body.appendChild(pop);
        const r = b.getBoundingClientRect(); pop.style.top = r.bottom + 6 + "px"; pop.style.left = r.left + "px";
        pop.querySelectorAll("[data-c]").forEach((x) => x.onclick = async () => {
          closePop(); await api(`/categories/${encodeURIComponent(name)}`, { method: "PATCH", body: { color: x.dataset.c } });
          S.cats = await api("/categories"); refreshAll(); $("#ced", m).innerHTML = catRows(); bind();
        });
      });
    };
    bind();
    $("#addcat", m).onclick = async () => {
      const n = $("#newcat", m).value.trim(); if (!n) return;
      await api("/categories", { method: "POST", body: { name: n } });
      S.cats = await api("/categories"); refreshAll(); $("#ced", m).innerHTML = catRows(); $("#newcat", m).value = ""; bind();
    };
    const wt = $("#wktest", m); if (wt) wt.onclick = async (e) => {
      e.preventDefault(); wt.textContent = "Sending…";
      try { await api("/summary/weekly/send", { method: "POST" }); toast("Sent. Check your phone"); } finally { wt.textContent = "Send one now"; }
    };
    const lo = $("#logout", m); if (lo) lo.onclick = () => { store.del("spend_token"); TOKEN = ""; closeModal(); renderLogin(); };
    $("#theme", m).onclick = () => { const t = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = t; store.set("spend_theme", t); closeModal(); refreshAll(); };
    $("#save", m).onclick = async () => {
      await api("/settings", { method: "PUT", body: { income_account: +$("#incacc", m).value || null } });
      for (const row of m.querySelectorAll(".cat-edit")) {
        const name = row.dataset.name;
        const newName = $(".cname", row).value.trim();
        const body = {};
        if (newName && newName !== name) body.new_name = newName;
        if (Object.keys(body).length) await api(`/categories/${encodeURIComponent(name)}`, { method: "PATCH", body });
      }
      S.settings = await api("/settings");
      closeModal(); toast("Saved"); refreshAll();
    };
  });
}

// ---------- tooltip ----------
const tip = $("#tip");
function hoverTip(el, html) {
  el.addEventListener("mouseenter", () => { tip.innerHTML = html(); tip.style.opacity = 1; });
  el.addEventListener("mousemove", (e) => {
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 12) + "px";
    tip.style.top = Math.max(8, e.clientY - h - 12) + "px";
  });
  el.addEventListener("mouseleave", () => (tip.style.opacity = 0));
  el.addEventListener("click", () => (tip.style.opacity = 0));
}

// ---------- go ----------
const savedTheme = store.get("spend_theme"); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => S.stats && refreshAll());
const qsMonth = new URLSearchParams(location.search).get("month"); if (qsMonth) S.month = qsMonth;
boot();
</script>
</body>
</html>
